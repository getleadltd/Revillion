name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy all Edge Functions after a successful preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: revillion-supabase-edge-production
  cancel-in-progress: false

jobs:
  preflight-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts

      - name: Test Edge authentication policy
        run: deno test --no-remote --no-npm supabase/functions/_shared/pipeline-auth_test.ts

      - name: Validate repository configuration
        shell: bash
        run: |
          set -euo pipefail

          config_project_ref="$(sed -nE 's/^project_id = "([a-z0-9]+)"$/\1/p' supabase/config.toml)"
          if [ -z "$config_project_ref" ]; then
            echo "::error::supabase/config.toml does not contain a valid project_id"
            exit 1
          fi

          mapfile -t function_dirs < <(
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -printf '%h\n' \
              | sed 's#^supabase/functions/##' \
              | sort
          )
          mapfile -t configured_functions < <(
            sed -nE 's/^\[functions\.([^]]+)\]$/\1/p' supabase/config.toml | sort
          )

          if ! diff -u \
            <(printf '%s\n' "${function_dirs[@]}") \
            <(printf '%s\n' "${configured_functions[@]}"); then
            echo "::error::Edge Function directories and supabase/config.toml do not match"
            exit 1
          fi

      - name: Reject production deploys from non-main refs
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production Edge Functions can only be deployed from main"
            exit 1
          fi

      - name: Validate Supabase credentials and target
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
          config_project_ref="$(sed -nE 's/^project_id = "([a-z0-9]+)"$/\1/p' supabase/config.toml)"
          projects_json="$(supabase projects list --output json)"
          if ! jq -e --arg ref "$config_project_ref" \
            'any(.[]; .id == $ref)' <<<"$projects_json" >/dev/null; then
            echo "::error::The configured Supabase token cannot access the target project"
            exit 1
          fi

      - name: Preflight complete (no deployment requested)
        if: ${{ !inputs.deploy }}
        run: echo "Preflight passed; deployment was not requested."

      - name: Deploy all edge functions
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          project_ref="$(sed -nE 's/^project_id = "([a-z0-9]+)"$/\1/p' supabase/config.toml)"

          # Deploy every dependency before the orchestrator. During this rollout,
          # an old child would reject Autopilot's new internal credential.
          for dir in supabase/functions/*/; do
            # Shared modules are imported by functions but are not deployable
            # function entrypoints themselves.
            if [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            func=$(basename "$dir")
            if [ "$func" = "autopilot" ]; then
              continue
            fi
            echo "Deploying $func..."
            supabase functions deploy "$func" \
              --project-ref "$project_ref"
          done

          echo "Deploying autopilot last..."
          supabase functions deploy "autopilot" \
            --project-ref "$project_ref"
