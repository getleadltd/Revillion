
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.9.6

    - name: Type-check Edge Functions
      run: deno check supabase/functions/*/index.ts

    - name: Test Edge authentication policy
      run: deno test --no-remote --no-npm supabase/functions/_shared/pipeline-auth_test.ts

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7
